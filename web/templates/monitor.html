<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='monitor.css') }}">
    <title>Monitoring - {{ username }}</title>
    </head>
<body>
    <div class="sidebar">
        <div class="logo">
            <a href="/dashboard" class="logo-link">
                <img src="{{ url_for('static', filename='assets/profile.svg') }}" alt="NOSIC Logo">
            <!-- Update with your logo URL -->
            <span class="logo-text">NOSIC</span>
          </div>
        <ul class="nav">
            <ul class="nav">
                <li><a href="/accounts">
                    <img src="{{ url_for('static', filename='assets/profile.svg') }}" alt="Akun" class="icon"> Daftar Akun</a>
                </li>
                <li><a href="/monitoring">
                    <img src="{{ url_for('static', filename='assets/chart.svg') }}" alt="Monitoring" class="icon"> Monitoring</a>
                </li>
                <li><a href="/settings">
                    <img src="{{ url_for('static', filename='assets/settings.svg') }}" alt="Settings" class="icon"> Settings</a>
                </li>
                <li><a href="{{ url_for('logout') }}">Logout</a></li>
            </ul>
        </ul>
    </div>

    <div class="main-content">
        <header>
            <h1>Monitoring Wajah untuk {{ username }}</h1>
            <p>Berikut adalah feed kamera untuk mendeteksi kantuk.</p>
        </header>

        <div class="video-container">
            <img id="videoFeed" src="{{ url_for('video_feed') }}" alt="Video Feed" style="display: block;">
        </div>

        <button id="startCamera">Mulai Kamera</button>
        <button id="stopCamera" style="display: none;">Matikan Kamera</button>
    </div>

    <script>
        document.getElementById('startCamera').addEventListener('click', function() {
            fetch('/start_video_feed', { method: 'POST' })
                .then(response => {
                    if (response.ok) {
                        document.getElementById('videoFeed').style.display = 'block';
                        this.style.display = 'none';
                        document.getElementById('stopCamera').style.display = 'inline';
                    }
                });
        });

        document.getElementById('stopCamera').addEventListener('click', function() {
            fetch('/stop_video_feed', { method: 'POST' })
                .then(response => {
                    if (response.ok) {
                        document.getElementById('videoFeed').style.display = 'none';
                        this.style.display = 'none';
                        document.getElementById('startCamera').style.display = 'inline';
                    }
                });
        });

        // Menangani aksi saat berpindah halaman
        window.addEventListener('beforeunload', function() {
            fetch('/stop_video_feed', { method: 'POST' });
        });
    </script>
</body>
</html>
